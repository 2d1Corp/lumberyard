{% extends "lumberyard/dashboard_base.html" %}

{% block title %}Categories | Lumberyard{% endblock %}

{% block content %}
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h1 class="mb-0">Categories</h1>
    <a class="btn btn-sm btn-primary" href="{% url 'category-create' %}">
      <i class="bi bi-plus-lg me-1"></i> Add category
    </a>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for category in category_list %}
          <tr>
            <td class="fw-semibold">{{ category.name }}</td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-secondary"
                 href="{% url 'category-update' category.pk %}">
                <i class="bi bi-pencil me-1"></i> Edit
              </a>
              <a class="btn btn-sm btn-outline-danger"
                 href="{% url 'category-delete' category.pk %}">
                <i class="bi bi-trash me-1"></i> Delete
              </a>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="2" class="text-center text-muted py-4">
              No categories yet.
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
