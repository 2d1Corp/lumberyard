{% extends "lumberyard/dashboard_base.html" %}

{% block title %}Delete warehouse | Lumberyard{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-xl-7">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h3 mb-3">Delete warehouse</h1>
          <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'warehouse-list' %}">
              Cancel
            </a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
