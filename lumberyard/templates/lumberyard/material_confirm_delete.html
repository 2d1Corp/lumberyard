{% extends "lumberyard/dashboard_base.html" %}

{% block title %}Delete material | Lumberyard{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-xl-7">
      <div class="card">
        <div class="card-body p-4">
          <h1 class="h3 mb-2">Delete material</h1>
          <p class="text-secondary mb-4">
            Are you sure you want to delete <strong>{{ object }}</strong>?
            This cannot be undone.
          </p>

          <form method="post">
            {% csrf_token %}
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'material-detail' object.pk %}">
              Cancel
            </a>
            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
