{% extends "lumberyard/base.html" %}

{% block body %}
  <div class="dashboard-shell">
    <aside class="dashboard-sidebar">
      <a class="dashboard-brand" href="{% url 'dashboard' %}">
        <span class="dashboard-brand-icon" aria-hidden="true">
          <i class="bi bi-tree-fill"></i>
        </span>
        <span>Lumberyard</span>
      </a>

      <nav class="dashboard-nav" aria-label="Dashboard navigation">
        <a
            class="dashboard-nav-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}"
            href="{% url 'dashboard' %}"
        >
          <i class="bi bi-grid-1x2"></i>
          <span>Dashboard</span>
        </a>

        <a
            class="dashboard-nav-link{% if request.resolver_match.url_name == 'material-list' or request.resolver_match.url_name == 'material-detail' %} active{% endif %}"
            href="{% url 'material-list' %}"
        >
          <i class="bi bi-box-seam"></i>
          <span>Materials</span>
        </a>
        <a
            class="dashboard-nav-link{% if request.resolver_match.url_name == 'replenishment-list' %} active{% endif %}"
            href="{% url 'replenishment-list' %}"
        >
          <i class="bi bi-cart-plus"></i>
          <span>Replenishment</span>
        </a>
        <a
            class="dashboard-nav-link{% if request.resolver_match.url_name == 'worker-list' or request.resolver_match.url_name == 'worker-create' %} active{% endif %}"
            href="{% url 'worker-list' %}"
        >
          <i class="bi bi-people"></i>
          <span>Workers</span>
        </a>

        <a class="dashboard-nav-link" href="{% url 'index' %}">
          <i class="bi bi-globe2"></i>
          <span>Public site</span>
        </a>
      </nav>

      <div class="dashboard-user">
        <span class="dashboard-user-avatar" aria-hidden="true">
          <i class="bi bi-person"></i>
        </span>

        <span class="dashboard-user-name">
          {{ user.username }}
        </span>

        <form class="mb-0 ms-auto" action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button
              class="dashboard-logout"
              type="submit"
              title="Log out"
              aria-label="Log out"
          >
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </form>
      </div>
    </aside>

    <main class="dashboard-main">
      <div class="dashboard-content">
        {% if messages %}
          <div class="mb-3">
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>
{% endblock %}
