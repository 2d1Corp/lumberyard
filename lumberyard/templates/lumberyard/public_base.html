{% extends "lumberyard/base.html" %}

{% block body %}
  <header class="public-header">
    <nav class="navbar py-3">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2 m-0"
           href="{% url 'index' %}">
          <span class="public-brand-icon">
            <i class="bi bi-tree-fill"></i>
          </span>
          <span class="fw-bold">Lumberyard</span>
        </a>
        <a class="nav-link ms-4"
           href="{% url 'public-material-list' %}">
          Catalog
        </a>
        <a class="nav-link ms-3"
           href="{% url 'delivery' %}">
          Delivery
        </a>
        <a class="nav-link ms-3"
           href="{% url 'contacts' %}">
          Contacts
        </a>
        <div class="d-flex align-items-center gap-2 ms-auto">
          {% if user.is_authenticated %}
            <span class="public-username d-none d-sm-inline">
            {{ user.username }}
            </span>

            <a class="btn btn-sm btn-primary"
               href="{% url 'dashboard' %}">
              Dashboard
            </a>

            <form action="{% url 'logout' %}" method="post">
              {% csrf_token %}
              <button type="submit"
                      class="btn btn-sm btn-outline-secondary">
                Logout
              </button>
            </form>
          {% else %}
            <a class="btn btn-sm btn-primary"
               href="{% url 'login' %}">
              Staff login
            </a>
          {% endif %}
        </div>
      </div>
    </nav>
  </header>
  <main class="container py-4">
    {% block content %}
    {% endblock %}
  </main>
{% endblock %}
